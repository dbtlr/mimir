# Run the host on Postgres: layer this file over compose.yaml.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.postgres.yaml up -d
#
# Write both secret files first (docs/guides/host.md#postgres). The URL's
# password must match postgres-password. To use a Postgres server you already
# run, drop the postgres service and depends_on, and point the URL at it.
services:
  mimir:
    environment:
      MIMIR_DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - database-url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimir
      POSTGRES_DB: mimir
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    ports:
      # Loopback only, for operator tooling on this machine (psql, backups). No
      # Mimir client connects here: the host reaches the database over the compose
      # network, and a CLI pairs with the host.
      - 127.0.0.1:${MIMIR_POSTGRES_PORT:-5433}:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, mimir, -d, mimir]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  database-url:
    file: ./secrets/database-url
  postgres-password:
    file: ./secrets/postgres-password

volumes:
  postgres:
