name: Service verify

# Proves the real supervisor lifecycle of `mimir service` (MMR-54): install,
# status, restart, kill-and-recover, stop, start, and uninstall, under real
# launchd on a macOS runner and real systemd user units on an Ubuntu runner.
# Both jobs run the same `bun run sandbox service-verify` a developer runs
# locally; it installs a sandbox installation under sandbox-scoped unit names,
# so nothing here can address a live unit.
#
# Manual only. It never runs on push or pull_request: a supervisor lifecycle
# takes minutes and needs nothing from an ordinary change.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which supervisor to verify
        type: choice
        options: [both, macos, linux]
        default: both

permissions:
  contents: read

jobs:
  macos:
    name: launchd (macOS)
    if: contains(fromJSON('["both","macos"]'), inputs.platform || 'both')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GitHub's macOS runners log the runner user into an Aqua session, so the
      # same gui/<uid> launchd domain a desktop uses is available.
      - name: Verify the launchd lifecycle
        run: bun run sandbox service-verify

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-verify-macos
          path: |
            .dev/sandbox-results/
            .dev/service-sandboxes/*/data/mimir/logs/
          if-no-files-found: ignore

  linux:
    name: systemd (Linux)
    if: contains(fromJSON('["both","linux"]'), inputs.platform || 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # systemd is PID 1 on the runner. Linger gives the runner user a
      # `systemd --user` manager without a login session, as on a headless host.
      - name: Start the runner user's systemd manager
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 60); do [ -S "$runtime/bus" ] && break; sleep 0.5; done
          [ -S "$runtime/bus" ] || { echo "no user manager bus at $runtime/bus" >&2; exit 1; }
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"

      - name: Verify the systemd lifecycle
        run: bun run sandbox service-verify

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-verify-linux
          path: |
            .dev/sandbox-results/
            .dev/service-sandboxes/*/data/mimir/logs/
          if-no-files-found: ignore
