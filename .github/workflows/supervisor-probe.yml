name: supervisor probe (temporary)
on:
  push:
    branches: [mmr-54-systemd-supervisor]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: launchd gui domain probe
        run: |
          set -x
          id -u; whoami
          launchctl print gui/$(id -u) | head -5 || true
          launchctl managername || true
          d=$(mktemp -d)
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>Label</key><string>dev.probe.sleep</string>' \
            '<key>ProgramArguments</key><array><string>/bin/sleep</string><string>600</string></array>' \
            '<key>RunAtLoad</key><true/><key>KeepAlive</key><true/>' \
            '</dict></plist>' > $d/probe.plist
          launchctl bootstrap gui/$(id -u) $d/probe.plist; echo "gui bootstrap exit $?"
          sleep 2
          launchctl print gui/$(id -u)/dev.probe.sleep | grep -E 'state|pid' || true
          launchctl kickstart -k gui/$(id -u)/dev.probe.sleep; echo "kickstart $?"
          sleep 2
          pid=$(launchctl print gui/$(id -u)/dev.probe.sleep | awk '/pid =/{print $3}')
          kill -9 $pid; sleep 12
          launchctl print gui/$(id -u)/dev.probe.sleep | grep -E 'state|pid' || true
          launchctl bootout gui/$(id -u)/dev.probe.sleep; echo "bootout $?"
          launchctl bootstrap user/$(id -u) $d/probe.plist; echo "user bootstrap exit $?"
          launchctl print user/$(id -u)/dev.probe.sleep | grep -E 'state|pid' || true
          launchctl bootout user/$(id -u)/dev.probe.sleep; echo "user bootout $?"
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: systemd user probe
        run: |
          set -x
          id -u; whoami
          sudo loginctl enable-linger "$(whoami)"
          for i in $(seq 1 20); do [ -S /run/user/$(id -u)/bus ] && break; sleep 0.5; done
          ls -la /run/user/$(id -u) || true
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          systemctl --user status --no-pager | head -5 || true
          systemctl --version | head -1
          mkdir -p ~/.config/systemd/user
          d=$(mktemp -d)
          printf '[Unit]\nStartLimitIntervalSec=0\n[Service]\nExecStart=/bin/sleep 600\nRestart=always\nRestartSec=1\nStandardOutput=append:%s/out.log\n[Install]\nWantedBy=default.target\n' "$d" > $d/probe.service
          systemctl --user enable $d/probe.service; echo "enable path $?"
          ls -la ~/.config/systemd/user ~/.config/systemd/user/default.target.wants || true
          systemctl --user daemon-reload
          systemctl --user restart probe.service; echo "restart $?"
          systemctl --user show probe.service --property=LoadState,ActiveState,SubState,MainPID
          pid=$(systemctl --user show probe.service --property=MainPID --value); kill -9 $pid; sleep 3
          systemctl --user show probe.service --property=LoadState,ActiveState,SubState,MainPID
          systemctl --user disable --now probe.service; echo "disable $?"
          ls -la ~/.config/systemd/user || true
          systemctl --user show probe.service --property=LoadState,ActiveState,SubState,MainPID
          cp $d/probe.service ~/.config/systemd/user/probe2.service
          systemctl --user enable ~/.config/systemd/user/probe2.service; echo "enable in-path $?"
          systemctl --user link $d/probe.service; echo "link out $?"
          systemctl --user link ~/.config/systemd/user/probe2.service; echo "link in-path $?"
