name: Prerelease tagger

# Every build-affecting push to main auto-tags a vX.Y.Z-next.N prerelease, which
# release.yml then builds + publishes (it already flags `-` tags as prerelease).
# The path filter is the changeset analyzer: a docs/vault-only merge doesn't
# match, so no prerelease is produced (MMR-57). X.Y.Z is the version the next
# cut will release, which the pending changelog fragments decide
# (`loom changelog write --dry-run` in packages/cli, ADR 0039); with no pending
# fragments there is nothing to release, so nothing is tagged.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'skills/mimir/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release.yml'
      - '.github/workflows/prerelease.yml'
      - 'install.sh'

# Serialize so two quick merges can't race on "highest + 1".
concurrency:
  group: prerelease-tagger
  cancel-in-progress: false

permissions:
  contents: write # push the tag
  actions: write # dispatch release.yml at the new tag

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute and push the prerelease tag
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `check` fails on any invalid fragment and counts the valid ones.
          checked=$(bun run --cwd packages/cli loom changelog check)
          echo "$checked"
          count=$(printf '%s\n' "$checked" | sed -nE 's/^Checked ([0-9]+) fragments?\.$/\1/p')
          if [ -z "$count" ]; then
            echo "::error::could not read the fragment count from: $checked"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "No pending changelog fragments in packages/cli/.changes, so there is nothing to release; no prerelease."
            exit 0
          fi
          ver=$(bun run --cwd packages/cli loom changelog write --dry-run \
                | sed -nE 's/^Next version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          if [ -z "$ver" ]; then
            echo "::error::loom changelog write --dry-run printed no next version."
            exit 1
          fi
          # Counter = highest existing vX.Y.Z-next.N for this version, + 1.
          # Only real prerelease builds create tags, so noop merges never
          # advance it; robust to pruning (we keep the max) and history shape.
          max=0
          for t in $(git tag -l "v${ver}-next.*"); do
            n="${t#"v${ver}"-next.}"
            case "$n" in (*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$max" ]; then max="$n"; fi
          done
          tag="v${ver}-next.$((max + 1))"
          echo "tagging $tag"
          git tag -a "$tag" -m "Prerelease $tag"
          git push origin "$tag"
          # Dispatch the build/publish at the new tag — a GITHUB_TOKEN tag
          # push won't trigger release.yml's `push: tags` (anti-recursion),
          # but workflow_dispatch via GITHUB_TOKEN does start a run.
          gh workflow run release.yml --ref "$tag"
          echo "dispatched release.yml @ $tag"
