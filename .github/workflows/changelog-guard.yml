name: Changelog guard

# Fail any PR that changes build-affecting paths but carries no changelog
# fragment under packages/cli/.changes/ — the backstop for the finishing-work
# skill's changelog gate (MMR-109, reshaped by ADR 0022 and ADR 0039).
# Fragments are Loom's (`breaking.<slug>.md`, `feature.<slug>.md`, `<slug>.md`),
# and `loom changelog write` compiles them into packages/cli/CHANGELOG.md only
# at the release cut.
#
# Escape hatch: a behavior-preserving PR (internal refactor, test/build-meta
# only) applies the `skip-changelog` label instead of a fragment.
#
# The release-cut PR passes structurally, no label needed: it deletes the
# fragments it writes into a new release section, and `loom changelog check`
# accepts an empty set. Deleting fragments any other way does not count.
#
# Runs on every PR and self-determines applicability so it is always a
# runnable, requireable check — a `paths:`-filtered required check would hang
# "pending" on PRs that don't match. `labeled`/`unlabeled` are listed so that
# applying `skip-changelog` re-runs the gate (a label change does not fire
# `synchronize`).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a changelog fragment for build-affecting changes
        id: gate
        env:
          # Visible PR escape hatch — kept here for the audit trail.
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"

          # Build-affecting paths — keep in sync with prerelease.yml's path filter
          # (GitHub Actions can't share a filter across workflows). A change outside
          # these can't affect a shipped binary or image, so no entry is needed.
          changed=$(git diff --name-only "${base}...HEAD")
          if ! echo "$changed" | grep -qE '^(packages/|skills/mimir/|package\.json$|bun\.lock$|Dockerfile$|\.dockerignore$|install\.sh$|\.github/workflows/(release|prerelease)\.yml$)'; then
            echo "No build-affecting paths changed — changelog fragment not required."
            exit 0
          fi

          # An Engine contract change, additive included, ships only in a minor
          # release (ADR 0038), and on 0.x only a breaking fragment cuts one
          # (ADR 0039). The schema snapshot and MIN_CLIENT mark the contract;
          # the label does not waive this.
          if echo "$changed" | grep -qE '^packages/contract/(engine-schemas\.json|src/version\.ts)$' \
            && ! ls packages/cli/.changes/breaking.*.md > /dev/null 2>&1; then
            echo "::error::This PR changes the Engine contract, which ships only in a minor release, but no breaking fragment is pending. Add packages/cli/.changes/breaking.<slug>.md; for an additive change, its migration is to update the host before its clients."
            exit 1
          fi

          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "skip-changelog label present — fragment waived (visible at merge)."
            exit 0
          fi

          # A fragment added or amended on this PR satisfies the gate. Deleting
          # fragments counts only for the release cut, which writes them into a
          # new `## vX.Y.Z - YYYY-MM-DD` section of the changelog. Loom reads
          # fragments flat in .changes/ and ignores hidden entries;
          # `loom changelog check` rejects a nested path or a non-Markdown file,
          # so any other file there counts.
          fragments=$(echo "$changed" | grep -E '^packages/cli/\.changes/[^.]' | grep -v '^packages/cli/\.changes/README\.md$' || true)
          present=$(echo "$fragments" | while IFS= read -r f; do if [ -n "$f" ] && [ -f "$f" ]; then echo "$f"; fi; done)
          # A plain grep reads all of git diff, so pipefail sees no SIGPIPE.
          section=$(git diff "${base}...HEAD" -- packages/cli/CHANGELOG.md | grep -E '^\+## v[0-9]+\.[0-9]+\.[0-9]+ - ' || true)
          if [ -z "$present" ] && [ -n "$fragments" ] && [ -n "$section" ]; then
            echo "Fragments deleted into a new release section — the release cut. Gate satisfied."
            present="$fragments"
          fi
          if [ -z "$present" ]; then
            echo "::error::Build-affecting change with no changelog fragment. Add packages/cli/.changes/<slug>.md (see packages/cli/.changes/README.md), or apply the 'skip-changelog' label if this is behavior-preserving."
            exit 1
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"
          echo "Changelog fragment(s) touched:"
          echo "$fragments"

      - name: Set up Bun
        if: steps.gate.outputs.check == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        if: steps.gate.outputs.check == 'true'
        run: bun install --frozen-lockfile

      # Loom's own validator, the one the release cut runs, checks every
      # fragment on head; an empty set (the release cut) passes.
      - name: Check fragments with Loom
        if: steps.gate.outputs.check == 'true'
        run: bun run --cwd packages/cli loom changelog check
