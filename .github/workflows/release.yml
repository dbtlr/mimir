name: Release

# Tag-driven releases. A `vX.Y.Z` tag builds standalone binaries (one per
# platform, each on its native runner so there is no cross-compile) and
# publishes a GitHub Release with notes pulled from CHANGELOG.md. The build
# matrix also runs on pull requests (build-only, no publish) so the release
# path is validated before a tag is ever cut.
#
# Publication is staged (MMR-387): the release is created as a draft, every
# asset is uploaded with bounded retries and verified by digest, and only the
# exact complete set flips the draft public after the host image is pushed
# and verified for anonymous pulls on both architectures. A failed publish leaves the draft
# behind; re-running the `publish` job resumes from it with the same build
# artifacts — no rebuild, no tag change.
on:
  push:
    tags: ['v*']
  # The prerelease tagger pushes vX.Y.Z-next.N tags with GITHUB_TOKEN, which
  # GitHub's anti-recursion guard blocks from triggering the `push: tags` event
  # above. It dispatches this workflow at the new tag instead (workflow_dispatch
  # via GITHUB_TOKEN is the documented exception that DOES start a run). The
  # build/publish steps read github.ref_name/ref_type, which resolve from the
  # dispatched --ref exactly as they do for a pushed tag (MMR-57).
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'skills/mimir/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release.yml'
      - 'install.sh'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, asset: mimir-darwin-arm64 }
          - { os: ubuntu-latest, asset: mimir-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: mimir-linux-arm64 }
          # darwin-x64 (Intel mac) is deferred — the macOS x64 runner is scarce
          # and bun's cross-compile is unreliable from an arm64 host. Intel-mac
          # users install from source (`bun add -g github:dbtlr/mimir`).
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Test on the target platform before shipping its binary.
      - name: Test
        run: bun run test

      # On a tag build, bake the tag (minus the leading v) as MIMIR_BUILD_VERSION —
      # both the binary compile below and the vite build read it (MMR-260), so
      # `--version`/`/api/health` and the embedded console report the exact same
      # release (MMR-57). PR build-validation runs on a branch ref and both sides
      # fall back to their package.json instead — fine, those binaries aren't
      # published.
      - name: Determine build version
        if: github.ref_type == 'tag'
        run: echo "MIMIR_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The host builds before the binary so its public assets embed (ADR 0013):
      # vite build → generate the asset manifest → compile.
      - name: Build UI
        run: bun run build:ui && bun run assets

      - name: Compile
        run: |
          mkdir -p dist
          # Only explicit installation grants access to live state.
          define=()
          if [ -n "${MIMIR_BUILD_VERSION:-}" ]; then
            define+=(--define "MIMIR_BUILD_VERSION=\"${MIMIR_BUILD_VERSION}\"")
          fi
          bun build packages/bin/src/main.ts --compile "${define[@]}" \
            --outfile "dist/${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  host-image:
    name: host image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine image version and tags
        id: metadata
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/bin/package.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          tags=("ghcr.io/dbtlr/mimir-host:${version}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=latest
            case "$version" in *-*) channel=next ;; esac
            tags+=("ghcr.io/dbtlr/mimir-host:${channel}")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${tags[@]}")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build host image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: MIMIR_BUILD_VERSION=${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No registry credentials: fleet must be able to pull the package publicly.
      # A newly created private GHCR package keeps the release unpublished until
      # its owner changes package visibility to public and re-runs this job.
      - name: Verify published image architectures and anonymous access
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          while IFS= read -r image; do
            docker manifest inspect "$image" > "$DOCKER_CONFIG/manifest.json"
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' "$DOCKER_CONFIG/manifest.json"
          done <<< "$IMAGE_TAGS"

  publish:
    name: publish release
    needs: [build, host-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hard ceiling over the publisher's own bounds: it stops starting retries
    # after a 60-minute budget and one in-flight request can overrun that by
    # its 3-minute deadline, so 90 leaves room for setup and the prune step
    # while guaranteeing a stalled upload never runs indefinitely.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: mimir-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum mimir-* > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog notes
        env:
          IMAGE_VERSION: ${{ needs.host-image.outputs.version }}
        run: |
          ver="${GITHUB_REF_NAME}"
          awk -v ver="$ver" '
            $0 ~ "^## " ver " " { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf '\n### Host image\n\n`ghcr.io/dbtlr/mimir-host:%s` (linux/amd64, linux/arm64).\n' "$IMAGE_VERSION" >> release-notes.md
          echo "--- release notes ---"; cat release-notes.md

      # Draft → upload (retried, verified) → publish. Exit 1 keeps the draft
      # for a re-run; see packages/bin/scripts/publish-release.ts.
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s failglob   # a missing binary fails here, not as a partial release
          args=(--tag "$GITHUB_REF_NAME" --notes release-notes.md)
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          bun packages/bin/scripts/publish-release.ts "${args[@]}" dist/mimir-* dist/SHA256SUMS

      # Prune stale prerelease tags + Releases at an official cut (MMR-58).
      # Lag-by-one retention: delete prereleases from cycles OLDER than the
      # previous official (so the just-shipped cycle's trail survives one more
      # release). Gated to official tags and best-effort, so a pruning hiccup
      # never fails a real release. Enumerates via `gh` because this job's
      # checkout is shallow and tagless, and the binaries live on the Releases.
      #
      # LIVE: deletes the prerelease Release + its tag. The dry-run was
      # validated at the v0.7.0 cut (lag-by-one correct, 0 deletions, no
      # cycles < the previous official yet) before enabling here (MMR-58).
      - name: Prune stale prereleases
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cut="${GITHUB_REF_NAME#v}"   # X.Y.Z being cut (official)

          # Previous official = highest non-prerelease version strictly < cut.
          prev=""
          while read -r v; do
            [ "$v" = "$cut" ] && continue
            [ "$(printf '%s\n%s\n' "$v" "$cut" | sort -V | tail -1)" = "$cut" ] && prev="$v"
          done < <(gh release list --limit 500 --json tagName,isPrerelease \
                     --jq '.[] | select(.isPrerelease == false) | .tagName' \
                   | sed 's/^v//' | sort -V)

          if [ -z "$prev" ]; then
            echo "No previous official before $cut; nothing to prune."
            exit 0
          fi
          echo "Cut $cut; previous official $prev — pruning prerelease cycles < $prev."

          gh release list --limit 500 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
          | while read -r tag; do
              base="${tag#v}"; base="${base%%-next.*}"   # cycle A.B.C
              lowest="$(printf '%s\n%s\n' "$base" "$prev" | sort -V | head -1)"
              if [ "$base" != "$prev" ] && [ "$lowest" = "$base" ]; then
                echo "deleting prerelease $tag (cycle $base < $prev)"
                gh release delete "$tag" --yes --cleanup-tag
              else
                echo "keep $tag (cycle $base >= $prev)"
              fi
            done
