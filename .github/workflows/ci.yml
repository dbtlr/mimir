name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same gate enforced locally: oxfmt + oxlint + type-aware typecheck,
      # warnings treated as errors (vite.config.ts: denyWarnings, maxWarnings 0).
      - name: Check (format · lint · typecheck)
        run: bun run check

      - name: Test
        run: bun run test --reporter=junit --reporter-outfile="$RUNNER_TEMP/bun-junit.xml"

      # The default lane's time budget (CONTRIBUTING.md, "Tests that run slow
      # or time out"), calibrated on this runner: a test over the limit fails.
      - name: Check the test budget
        run: bun run test:budget "$RUNNER_TEMP/bun-junit.xml"

      - name: Test disposable Postgres
        run: bun run test:postgres

      - name: Test sandbox installer lifecycle
        run: bun run test:sandbox

      - name: Install host browser
        run: bun run --cwd packages/host playwright install --with-deps chromium

      - name: Test host
        run: bun run test:host

      # The default reporter keeps the log readable; the junit report feeds the budget.
      - name: Test UI
        run: bun run test:ui --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/ui-junit.xml"

      # The host Vitest lane's time budget, the same as the default bun lane's.
      - name: Check the UI test budget
        run: bun run test:budget "$RUNNER_TEMP/ui-junit.xml"
